<div class="form-field">
  <label class="form-field__label" [for]="selectId">
    {{ (label() ?? placeholder()) | translate }}
    @if (required()) {
      <span class="form-field__required" aria-hidden="true">*</span>
    }
  </label>

  <select
    class="form-field__control"
    [class.form-field__control--error]="errorMessage() && touched()"
    [id]="selectId"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="(errorMessage() && touched()) || null"
    [attr.aria-describedby]="(errorMessage() && touched()) || hint() ? messageId : null"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  >
    <option value="" disabled [selected]="value() === ''">{{ placeholder() | translate }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.label | translate }}</option>
    }
  </select>

  @if (errorMessage() && touched()) {
    <span [id]="messageId" class="form-field__message form-field__message--error">{{ errorMessage() | translate }}</span>
  } @else if (hint(); as hintText) {
    <span [id]="messageId" class="form-field__message">{{ hintText | translate }}</span>
  }
</div>
