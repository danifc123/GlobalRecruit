<div class="actions-menu">
  <button
    #trigger
    type="button"
    class="actions-menu__trigger"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <span class="actions-menu__trigger-label">{{ label() | translate }}</span>
    <app-icon name="more-horizontal" [size]="18" />
  </button>

  @if (open()) {
    <button
      type="button"
      class="actions-menu__backdrop"
      tabindex="-1"
      aria-hidden="true"
      (click)="close()"
    ></button>
    <div class="actions-menu__panel" role="menu" tabindex="-1" [style]="panelStyle()" (click)="close()" (keydown)="close()">
      <ng-content />
    </div>
  }
</div>
