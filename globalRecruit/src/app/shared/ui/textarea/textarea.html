<div class="form-field">
  @if (label(); as labelText) {
    <label class="form-field__label" [for]="textareaId">{{ labelText | translate }}</label>
  }

  <textarea
    class="form-field__control form-field__control--multiline"
    [id]="textareaId"
    [rows]="rows()"
    [placeholder]="placeholder() | translate"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-describedby]="hint() ? messageId : null"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  ></textarea>

  @if (hint(); as hintText) {
    <span [id]="messageId" class="form-field__message">{{ hintText | translate }}</span>
  }
</div>
