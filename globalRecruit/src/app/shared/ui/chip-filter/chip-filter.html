<div class="chip-filter" role="tablist">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="tab"
      class="chip-filter__chip"
      [class.chip-filter__chip--active]="option.value === selected()"
      [attr.aria-selected]="option.value === selected()"
      (click)="selected.set(option.value)"
    >
      {{ option.label }}@if (option.count !== undefined) {
        <span> · {{ option.count }}</span>
      }
    </button>
  }
</div>
