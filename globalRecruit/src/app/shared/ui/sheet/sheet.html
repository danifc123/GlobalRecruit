@if (open()) {
  <button
    type="button"
    class="sheet__backdrop"
    tabindex="-1"
    aria-hidden="true"
    (click)="close()"
  ></button>
  <div class="sheet" role="dialog" aria-modal="true" [attr.aria-labelledby]="title() ? titleId : null">
    <header class="sheet__header">
      @if (title(); as titleText) {
        <h2 [id]="titleId" class="sheet__title">{{ titleText }}</h2>
      }
      <button #closeButton type="button" class="sheet__close" aria-label="Fechar" (click)="close()">
        <app-icon name="close" [size]="18" />
      </button>
    </header>
    <div class="sheet__body">
      <ng-content />
    </div>
  </div>
}
