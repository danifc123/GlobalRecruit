@if (open()) {
  <button
    type="button"
    class="sheet__backdrop"
    [class.sheet__backdrop--drawer]="drawer()"
    [class.sheet__backdrop--bottom]="bottom()"
    tabindex="-1"
    aria-hidden="true"
    (click)="close()"
  ></button>
  <div
    class="sheet"
    [class.sheet--drawer]="drawer()"
    [class.sheet--bottom]="bottom()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title() ? titleId : null"
  >
    <header class="sheet__header">
      @if (title(); as titleText) {
        <h2 [id]="titleId" class="sheet__title">{{ titleText | translate }}</h2>
      }
      <button #closeButton type="button" class="sheet__close" [attr.aria-label]="'Fechar' | translate" (click)="close()">
        <app-icon name="close" [size]="18" />
      </button>
    </header>
    <div class="sheet__body">
      <ng-content />
    </div>
  </div>
}
