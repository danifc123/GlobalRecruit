<div class="page">
  <app-banner tone="warning" icon="shield" layout="boxed">
    <strong>Visão Restrita para Parceiros</strong>
    <span banner-description>
      Esta tabela omite automaticamente colunas confidenciais de comissões e clientes.
    </span>
  </app-banner>

  <app-table
    [columns]="columns"
    [isEmpty]="isEmpty()"
    emptyIcon="users"
    emptyMessage="Nenhum projeto atribuído a esta visão ainda."
  >
    @for (vaga of vagas(); track vaga.id) {
      <tr>
        <td data-label="Cargo">{{ vaga.cargo }}</td>
        <td data-label="Idioma">{{ vaga.idioma ?? '—' }}</td>
        <td data-label="País">{{ vaga.pais ?? '—' }}</td>
        <td data-label="Modalidade">{{ vaga.modalidade ?? '—' }}</td>
        <td data-label="Prioridade">{{ vaga.prioridade }}</td>
        <td data-label="Status">{{ vaga.status }}</td>
      </tr>
    }
  </app-table>
</div>
