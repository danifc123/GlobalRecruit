<nav class="bottom-nav" [attr.aria-label]="'Navegação principal' | translate">
  @for (item of leftItems(); track item.path) {
    <a
      class="bottom-nav__item"
      [routerLink]="item.path"
      routerLinkActive="bottom-nav__item--active"
      [ariaCurrentWhenActive]="'page'"
    >
      @if (item.icon) {
        <app-icon [name]="item.icon" [size]="20" />
      }
      <span class="bottom-nav__label">{{ item.label | translate }}</span>
    </a>
  }

  @if (showFab()) {
    <button type="button" class="bottom-nav__fab" [attr.aria-label]="'Nova vaga' | translate" (click)="fab.emit()">
      <app-icon name="plus" [size]="22" />
    </button>
  }

  @for (item of rightItems(); track item.path) {
    <a
      class="bottom-nav__item"
      [routerLink]="item.path"
      routerLinkActive="bottom-nav__item--active"
      [ariaCurrentWhenActive]="'page'"
    >
      @if (item.icon) {
        <app-icon [name]="item.icon" [size]="20" />
      }
      <span class="bottom-nav__label">{{ item.label | translate }}</span>
    </a>
  }
</nav>
