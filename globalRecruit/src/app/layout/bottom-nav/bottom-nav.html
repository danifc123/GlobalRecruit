<nav class="bottom-nav" aria-label="Navegação principal">
  @for (item of leftItems(); track item.path) {
    <a
      class="bottom-nav__item"
      [routerLink]="item.path"
      routerLinkActive="bottom-nav__item--active"
      [ariaCurrentWhenActive]="'page'"
    >
      @if (item.icon) {
        <app-icon [name]="item.icon" [size]="20" />
      }
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }

  @if (showFab()) {
    <button type="button" class="bottom-nav__fab" aria-label="Nova vaga" (click)="fab.emit()">
      <app-icon name="plus" [size]="22" />
    </button>
  }

  @for (item of rightItems(); track item.path) {
    <a
      class="bottom-nav__item"
      [routerLink]="item.path"
      routerLinkActive="bottom-nav__item--active"
      [ariaCurrentWhenActive]="'page'"
    >
      @if (item.icon) {
        <app-icon [name]="item.icon" [size]="20" />
      }
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }
</nav>
